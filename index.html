<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3fbea">
<title>감정 확대경</title>
<!-- PHASE 3I: 9 representative expansion-safe final -->
<style>

:root{
  --ink:#10254a;
  --muted:#66738a;
  --muted-2:#8c96a8;
  --line:#dbe4ef;
  --paper:#fff;
  --page:#f3fbea;
  --explore-page:#f3fbea;
  --explore-page-deep:#eaf7dd;
  --explore-primary:#26863a;
  --explore-primary-deep:#237a35;
  --explore-soft:#e9f8de;
  --quiz-page:#fff0f5;
  --quiz-page-deep:#ffe5ef;
  --quiz-primary:#da3369;
  --quiz-primary-deep:#bd1f54;
  --quiz-soft:#ffe0eb;
  --quiz-ink:#6f2847;
  --correct:#3fae7a;
  --correct-soft:#e8f8f0;
  --wrong:#e88f76;
  --wrong-soft:#fff0eb;
  --cream:#fffdf9;
  --shadow:0 16px 36px rgba(31,58,100,.10);
  --soft-shadow:0 9px 22px rgba(31,58,100,.09);
  --radius:30px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Arial,sans-serif;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:normal;line-break:strict}
body{min-height:100dvh}
button{font:inherit;color:inherit;word-break:keep-all;overflow-wrap:normal}
h1,h2,h3,p,.rep-name,.node,.meaning-word,.meaning-text,.btn,.quiz-entry-btn,.quiz-mode-badge,.quiz-top-title,.quiz-prompt,.quiz-question-label,.quiz-choice,.quiz-feedback-title,.quiz-feedback-answer,.quiz-feedback-contrast,.quiz-next,.quiz-count,.quiz-result-note,.review-chip,.perfect-copy{word-break:keep-all;overflow-wrap:normal}
button:focus-visible{outline:3px solid rgba(39,91,174,.30);outline-offset:3px}
.app{min-height:100dvh;display:flex;justify-content:center}
.phone{width:100%;max-width:430px;min-height:100dvh;background:var(--cream);position:relative;overflow-x:hidden}
.screen{min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));animation:screenIn .20s ease both}
@keyframes screenIn{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (min-width:600px){.app{padding:26px}.phone{min-height:calc(100dvh - 52px);border-radius:38px;box-shadow:var(--shadow);border:1px solid #edf0f5;overflow:hidden}.screen{min-height:calc(100dvh - 52px)}}

/* HOME */
.home-head{text-align:center;padding-top:22px;margin-bottom:22px}
.home-head h1{font-size:39px;line-height:1.08;letter-spacing:-2.1px;margin:0 0 9px;font-weight:900;text-wrap:balance}
.home-head p{font-size:17px;color:var(--muted);margin:0;letter-spacing:-.45px;font-weight:650}
.rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.rep-card{appearance:none;border:1.5px solid color-mix(in srgb,var(--accent) 24%,white);border-radius:29px;background:color-mix(in srgb,var(--soft) 90%,white);min-height:148px;padding:15px 12px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 10%,transparent),0 12px 22px rgba(31,58,100,.065);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease,filter .15s ease}
.rep-card:active{transform:translateY(3px) scale(.98);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 9%,transparent),0 7px 14px rgba(31,58,100,.055)}
@media (hover:hover){.rep-card:hover{transform:translateY(-2px);filter:saturate(1.06);box-shadow:0 7px 0 color-mix(in srgb,var(--accent) 10%,transparent),0 15px 25px rgba(31,58,100,.09);border-color:color-mix(in srgb,var(--accent) 42%,white)}}
.rep-icon{width:64px;height:64px;border-radius:23px;color:var(--accent);background:rgba(255,255,255,.66);border:1px solid color-mix(in srgb,var(--accent) 18%,white);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 5px 12px color-mix(in srgb,var(--accent) 8%,transparent)}
.rep-icon svg{width:47px;height:47px;stroke-width:2.25;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.rep-name{font-size:23px;font-weight:900;letter-spacing:-.9px}
.quiz-entry{margin:17px 0 0}
.quiz-entry-btn{appearance:none;width:100%;min-height:62px;border:1px solid var(--explore-primary-deep);border-radius:22px;background:var(--explore-primary);color:#fff;font-size:19px;font-weight:900;letter-spacing:-.7px;cursor:pointer;box-shadow:0 6px 0 var(--explore-primary-deep),0 13px 22px rgba(38,134,58,.18);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .14s ease,box-shadow .14s ease,filter .14s ease}
.quiz-entry-btn:after{content:"→";font-size:21px;font-weight:850;opacity:.9}.quiz-entry-btn:active{transform:translateY(4px) scale(.99);box-shadow:0 2px 0 var(--explore-primary-deep),0 7px 14px rgba(38,134,58,.14)}

/* TOP / DETAIL */
.topbar{height:42px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;margin-bottom:1px}
.back{appearance:none;border:0;background:transparent;width:46px;height:46px;border-radius:17px;display:grid;place-items:center;cursor:pointer;margin-left:-8px;transition:background .15s ease,transform .15s ease}
.back:active{transform:scale(.94);background:#f2f5fa}.back svg{width:26px;height:26px;fill:none;stroke:var(--ink);stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round}
.top-label{text-align:center;color:#586780;font-size:14px;font-weight:850;letter-spacing:-.35px}
.detail-title{text-align:center;margin:0 0 2px}.detail-title h1{display:none}.detail-title p{margin:3px 0 0;color:#6e7b90;font-size:13.5px;line-height:1.35;font-weight:650}
.map-wrap{position:relative;width:100%;max-width:360px;margin:3px auto 0}
.map-stage{position:relative;width:100%;aspect-ratio:1/1;height:auto;min-height:300px}
.connectors{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.connectors line{stroke:color-mix(in srgb,var(--accent) 20%,#cfd7e3);stroke-width:1.55;stroke-dasharray:3 5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.center-emotion{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:112px;height:112px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;text-align:center;font-size:27px;font-weight:900;letter-spacing:-1px;box-shadow:0 7px 0 color-mix(in srgb,var(--accent) 76%,#000 8%),0 16px 28px color-mix(in srgb,var(--accent) 21%,transparent),inset 0 1px 0 rgba(255,255,255,.28);z-index:2}
.node{--node-soft:#f5f6f8;position:absolute;transform:translate(-50%,-50%);width:90px;min-height:56px;padding:8px 7px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--accent) 13%,#d9e0e9);background:color-mix(in srgb,var(--node-soft) 90%,white);font-size:15.5px;font-weight:850;letter-spacing:-.55px;cursor:pointer;display:grid;place-items:center;text-align:center;line-height:1.15;box-shadow:0 4px 0 rgba(37,57,91,.035),0 7px 15px rgba(31,58,100,.045);z-index:3;transition:opacity .18s ease,transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease,color .16s ease}
.node.enter{animation:nodeIn .20s ease both}@keyframes nodeIn{from{opacity:0;transform:translate(-50%,-50%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.node.selected{border:2.5px solid var(--accent);background:#fff;color:color-mix(in srgb,var(--accent) 72%,#172744);box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 12%,transparent),0 10px 20px color-mix(in srgb,var(--accent) 13%,transparent)}
.node:active{transform:translate(-50%,-50%) scale(.95)}
.node[data-pos="0"]{left:50%;top:12%}.node[data-pos="1"]{left:80.5%;top:25.5%}.node[data-pos="2"]{left:86%;top:50%}.node[data-pos="3"]{left:78.5%;top:74.5%}.node[data-pos="4"]{left:50%;top:87.5%}.node[data-pos="5"]{left:21.5%;top:74.5%}.node[data-pos="6"]{left:14%;top:50%}.node[data-pos="7"]{left:19.5%;top:25.5%}
.set-indicator{display:flex;justify-content:center;gap:6px;margin:-1px 0 8px;min-height:8px}.set-indicator span{width:8px;height:8px;border-radius:50%;background:#dce2ea;transition:.16s}.set-indicator span.on{width:23px;border-radius:7px;background:var(--accent)}
.meaning-card{position:relative;border:1.5px solid color-mix(in srgb,var(--accent) 12%,#e0e5ec);border-radius:25px;background:#fff;box-shadow:var(--soft-shadow);min-height:112px;padding:18px 21px 16px;text-align:center;margin:0 auto 13px;display:flex;flex-direction:column;justify-content:center}
.meaning-card:before{content:"";position:absolute;width:16px;height:16px;left:50%;top:-9px;background:#fff;border-left:1.5px solid color-mix(in srgb,var(--accent) 12%,#e0e5ec);border-top:1.5px solid color-mix(in srgb,var(--accent) 12%,#e0e5ec);transform:translateX(-50%) rotate(45deg)}
.meaning-word{font-size:24px;font-weight:900;letter-spacing:-.9px;margin-bottom:7px;position:relative}.meaning-text{font-size:15px;line-height:1.5;color:#48556a;letter-spacing:-.3px;position:relative;word-break:keep-all}.meaning-placeholder .meaning-word{font-size:16px;color:#6b778b;margin-bottom:0}.meaning-placeholder .meaning-text{display:none}
.actions{display:grid;gap:9px}.btn{appearance:none;border-radius:19px;min-height:54px;padding:12px 16px;font-size:16.5px;font-weight:850;letter-spacing:-.45px;cursor:pointer;transition:transform .14s ease,box-shadow .14s ease,filter .14s ease}.btn:active{transform:translateY(2px) scale(.99)}
.btn-primary{border:1px solid color-mix(in srgb,var(--accent) 88%,#000 5%);background:var(--accent);color:white;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 74%,#000 10%),0 9px 17px color-mix(in srgb,var(--accent) 16%,transparent)}.btn-secondary{border:1.5px solid #cfd8e4;background:white;color:#233755;box-shadow:0 3px 0 #edf0f4}

/* PHASE 3F — QUIZ MODE / NAVIGATION (structure retained; colors moved to PHASE 3G tokens) */
.quiz-mode{background:var(--quiz-page);animation:quizModeIn .19s ease both}
.nav-home{appearance:none;border:0;background:transparent;width:46px;height:46px;border-radius:17px;display:grid;place-items:center;cursor:pointer;margin-right:-8px;justify-self:end;transition:background .15s ease,transform .15s ease}
.nav-home:active{transform:scale(.94)}.nav-home svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:2.15;stroke-linecap:round;stroke-linejoin:round}
.quiz-mode-badge{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 13px;border-radius:999px;font-size:12px;font-weight:900;margin-bottom:10px}
.quiz-select-head{text-align:center;padding-top:4px;margin:0 0 18px}.quiz-select-head h1{font-size:29px;line-height:1.2;letter-spacing:-1.25px;margin:0;font-weight:900;text-wrap:balance}
.quiz-result-screen .quiz-result-main{padding-top:20px}
@media (max-width:380px){.quiz-select-head h1{font-size:27px}.quiz-mode-badge{height:28px;font-size:11.5px}.nav-home,.back{width:44px;height:44px}}

/* QUIZ SELECT */
.quiz-select-screen .home-head{padding-top:6px;margin-bottom:19px}.quiz-select-screen .home-head h1{font-size:35px}.quiz-select-screen .rep-card{min-height:120px;border-radius:25px}.quiz-select-screen .rep-icon{width:52px;height:52px;border-radius:19px}.quiz-select-screen .rep-icon svg{width:38px;height:38px}.quiz-select-screen .rep-name{font-size:20px}

/* QUIZ INTRO */
.quiz-intro-screen{display:flex;flex-direction:column}.quiz-intro-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 6px 44px}.quiz-intro-icon{width:88px;height:88px;border-radius:31px;background:color-mix(in srgb,var(--soft) 90%,white);border:1.5px solid color-mix(in srgb,var(--accent) 22%,white);color:var(--accent);display:grid;place-items:center;margin-bottom:22px;box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 8%,transparent),0 13px 24px rgba(31,58,100,.07)}.quiz-intro-icon svg{width:56px;height:56px;stroke-width:2.2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}.quiz-intro-main h1{font-size:32px;margin:0 0 9px;letter-spacing:-1.3px;font-weight:900}.quiz-intro-meta{font-size:16px;color:#5f6b80;font-weight:850;margin-bottom:24px}.quiz-start-btn{width:100%;max-width:320px;min-height:60px;border:1px solid color-mix(in srgb,var(--accent) 88%,#000 5%);border-radius:21px;background:var(--accent);color:#fff;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 75%,#000 9%),0 12px 21px color-mix(in srgb,var(--accent) 16%,transparent);transition:transform .14s ease,box-shadow .14s ease}.quiz-start-btn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 75%,#000 9%),0 7px 14px color-mix(in srgb,var(--accent) 13%,transparent)}

/* QUIZ PLAY */
.quiz-play-screen{padding-top:calc(14px + env(safe-area-inset-top));display:flex;flex-direction:column}.quiz-play-screen .topbar{margin-bottom:0}.quiz-top-title{text-align:center;font-size:14.5px;color:#4e5e77;font-weight:900;letter-spacing:-.4px}.quiz-progress-head{display:flex;justify-content:center;align-items:center;margin:6px 0 8px}.quiz-progress-pill{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:31px;padding:0 14px;border-radius:999px;background:#f0f3f8;color:#293a56;font-size:14.5px;font-weight:900;letter-spacing:-.35px}.quiz-progress-track{height:7px;border-radius:8px;background:#e9eef4;overflow:hidden;margin-bottom:15px}.quiz-progress-fill{height:100%;border-radius:8px;background:var(--accent);transition:width .20s ease}
.quiz-prompt-card{min-height:198px;border:1.5px solid color-mix(in srgb,var(--accent) 12%,#dfe6ef);background:#fff;border-radius:28px;box-shadow:0 7px 0 rgba(31,58,100,.025),0 15px 28px rgba(31,58,100,.075);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:23px 23px 25px;margin-bottom:14px}.quiz-prompt-icon{width:62px;height:62px;border-radius:23px;display:grid;place-items:center;margin:0 auto 15px;background:color-mix(in srgb,var(--soft) 92%,white);border:1px solid color-mix(in srgb,var(--accent) 18%,white);color:var(--accent)}.quiz-prompt-icon svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}.quiz-prompt{font-size:22px;line-height:1.43;font-weight:900;letter-spacing:-.85px;word-break:keep-all;margin:0;text-wrap:balance}.quiz-question-label{text-align:center;font-size:15.5px;color:#46556d;font-weight:850;margin:0 0 11px;letter-spacing:-.4px}
.quiz-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.quiz-choice{appearance:none;min-height:64px;border:1.5px solid #d6e0eb;border-radius:20px;background:#fff;font-size:17px;font-weight:900;letter-spacing:-.55px;cursor:pointer;padding:10px 8px;box-shadow:0 4px 0 #eef2f6;transition:transform .12s ease,border-color .15s ease,background .15s ease,box-shadow .15s ease}.quiz-choice:active:not(:disabled){transform:translateY(2px) scale(.985);box-shadow:0 2px 0 #eef2f6}.quiz-choice:disabled{opacity:1;color:inherit;cursor:default}.quiz-choice.selected{border-width:2px;border-color:#7d8ca2;background:#f5f8fb}.quiz-choice.correct{border-width:2.5px;border-color:var(--accent);background:color-mix(in srgb,var(--soft) 83%,white);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 14%,transparent),0 9px 17px color-mix(in srgb,var(--accent) 10%,transparent)}.quiz-choice.wrong{border-width:2px;border-color:#d69a83;background:#fff7f3}
.quiz-feedback{margin-top:13px;border:1.5px solid color-mix(in srgb,var(--accent) 18%,#e1e7ef);border-radius:22px;background:color-mix(in srgb,var(--soft) 48%,white);padding:14px 17px;box-shadow:0 7px 16px rgba(31,58,100,.055);animation:feedbackIn .18s ease both}.quiz-feedback-title{font-size:17px;font-weight:900;margin:0 0 5px;letter-spacing:-.45px}.quiz-feedback-title strong{color:color-mix(in srgb,var(--accent) 80%,#17304f)}.quiz-feedback-answer{font-size:14.5px;line-height:1.46;color:#34445d;margin:0;word-break:keep-all;font-weight:700}.quiz-feedback-contrast{font-size:12.5px;line-height:1.42;color:#69768b;margin:6px 0 0;word-break:keep-all}.quiz-next{appearance:none;width:100%;min-height:54px;margin-top:10px;border:1px solid color-mix(in srgb,var(--accent) 88%,#000 5%);border-radius:19px;background:var(--accent);color:#fff;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 75%,#000 9%),0 9px 18px color-mix(in srgb,var(--accent) 14%,transparent)}.quiz-next:active{transform:translateY(2px)}.quiz-spacer{flex:1;min-height:7px}@keyframes feedbackIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* QUIZ RESULT */
.quiz-result-screen{display:flex;flex-direction:column}.quiz-result-main{flex:1;text-align:center;padding:14px 2px 6px}.quiz-result-main h1{font-size:25px;margin:0 0 13px;letter-spacing:-.8px;font-weight:900}.quiz-score{font-size:68px;line-height:1;font-weight:950;letter-spacing:-2.7px;color:var(--quiz-primary);margin-bottom:5px}.quiz-score small{font-size:22px;letter-spacing:-.6px;font-weight:900}.quiz-count{font-size:15px;color:#637087;font-weight:850;margin-bottom:15px}.quiz-result-note{font-size:12.5px;line-height:1.45;color:#657188;padding:0 7px;margin:0 auto 16px;max-width:340px;word-break:keep-all;font-weight:650}.review-card{text-align:left;border:1.5px solid #e0e7f0;border-radius:22px;padding:15px 16px;margin:0 auto 15px;max-width:350px;background:#fff;box-shadow:0 7px 18px rgba(31,58,100,.055)}.review-card h2{font-size:15px;margin:0 0 10px;font-weight:900}.review-pairs{display:flex;flex-wrap:wrap;gap:7px}.review-chip{border-radius:14px;padding:8px 10px;background:#f1f5fa;color:#43536c;font-size:13px;font-weight:800}.perfect-copy{font-size:14px;line-height:1.5;color:#43516a;margin:0;font-weight:700}.result-actions{display:grid;gap:9px;margin-top:auto}.result-actions .btn{min-height:50px}

/* EXIT SHEET */
.quiz-exit-overlay{position:fixed;inset:0;background:rgba(16,31,57,.25);display:flex;align-items:flex-end;justify-content:center;padding:18px;z-index:30}.quiz-exit-box{width:min(390px,100%);background:#fff;border-radius:27px;padding:20px;box-shadow:0 18px 50px rgba(15,25,42,.18);text-align:center}.quiz-exit-box h2{font-size:20px;margin:0 0 6px;font-weight:900}.quiz-exit-box p{font-size:13px;color:#6b778b;margin:0 0 15px}.quiz-exit-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quiz-exit-actions button{min-height:49px;border-radius:17px;font-weight:850;cursor:pointer}.quiz-exit-stay{border:1.5px solid #d4dde8;background:#fff}.quiz-exit-leave{border:0;background:var(--quiz-primary);color:#fff}

@media (max-width:370px){
 .screen{padding-left:16px;padding-right:16px}.home-head{padding-top:15px;margin-bottom:18px}.home-head h1{font-size:35px}.home-head p{font-size:16px}.rep-grid{gap:11px}.rep-card{min-height:132px;border-radius:26px}.rep-icon{width:56px;height:56px;border-radius:20px}.rep-icon svg{width:42px;height:42px}.rep-name{font-size:21px}.quiz-entry{margin-top:14px}.quiz-entry-btn{min-height:56px;font-size:18px;border-radius:20px}
 .map-wrap{max-width:332px;margin-top:1px}.center-emotion{width:102px;height:102px;font-size:24px}.node{width:82px;min-height:52px;font-size:14px;padding:7px 5px}.meaning-card{min-height:103px;padding:15px 17px;margin-bottom:11px}.meaning-word{font-size:22px}.meaning-text{font-size:14px}.btn{min-height:50px}
 .quiz-select-screen .rep-card{min-height:105px}.quiz-select-screen .rep-icon{width:46px;height:46px}.quiz-select-screen .rep-icon svg{width:34px;height:34px}.quiz-select-screen .rep-name{font-size:19px}.quiz-intro-main{padding-bottom:25px}.quiz-intro-icon{width:76px;height:76px;border-radius:27px}.quiz-intro-icon svg{width:49px;height:49px}.quiz-intro-main h1{font-size:29px}.quiz-prompt-card{min-height:174px;padding:17px 17px 19px;margin-bottom:11px}.quiz-prompt-icon{width:51px;height:51px;border-radius:19px;margin-bottom:10px}.quiz-prompt-icon svg{width:35px;height:35px}.quiz-prompt{font-size:19px}.quiz-choice{min-height:57px;font-size:15.5px}.quiz-feedback{padding:12px 14px}.quiz-next{min-height:49px}.quiz-score{font-size:58px}
}

  --button-shadow-pink:0 6px 0 var(--quiz-primary-deep),0 13px 23px rgba(218,51,105,.20);

  if(pages.length<=1)return cards;
  return cards+`<div class="rep-page-nav" aria-label="대표감정 페이지"><button data-rep-page-prev="${mode}" ${state[key]===0?'disabled':''} aria-label="이전 감정 페이지">‹</button><span>${state[key]+1} / ${pages.length}</span><button data-rep-page-next="${mode}" ${state[key]===pages.length-1?'disabled':''} aria-label="다음 감정 페이지">›</button></div>`;
}
function bindRepPager(mode,rerender){const key=mode==='quiz'?'quizRepPage':'homeRepPage';const pages=representativePages();const prev=app.querySelector(`[data-rep-page-prev="${mode}"]`),next=app.querySelector(`[data-rep-page-next="${mode}"]`);if(prev)prev.addEventListener('click',()=>{state[key]=Math.max(0,state[key]-1);rerender()});if(next)next.addEventListener('click',()=>{state[key]=Math.min(pages.length-1,state[key]+1);rerender()})}

function escapeHTML(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function currentRep(){return representativeEmotionMap.representatives.find(r=>r.id===state.currentRepresentative)}
function quizRep(){return representativeEmotionMap.representatives.find(r=>r.id===state.quiz.representative)}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function safeRecent(rep){try{return JSON.parse(sessionStorage.getItem('emotionLensQuizRecent:'+rep)||'[]')}catch(_e){return []}}
function saveRecent(rep,ids){try{sessionStorage.setItem('emotionLensQuizRecent:'+rep,JSON.stringify(ids.slice(0,12)))}catch(_e){}}

function render(){
  if(state.mode==='HOME')return renderHome();
  if(state.mode==='EXPLORE_DETAIL')return renderDetail();
  if(state.mode==='QUIZ_SELECT')return renderQuizSelect();
  if(state.mode==='QUIZ_INTRO')return renderQuizIntro();
  if(state.mode==='QUIZ_PLAY')return renderQuizPlay();
  if(state.mode==='QUIZ_RESULT')return renderQuizResult();
  renderHome();
}
function renderHome(){
  state.mode='HOME';state.currentRepresentative=null;state.setIndex=0;state.selectedWord=null;state.quiz={representative:null,questions:[],index:0,score:0,answers:[],completed:false,answered:false,selected:null};
  app.innerHTML=`<section class="screen home-screen">
    <header class="home-head"><h1>감정 확대경</h1><p>어떤 마음을 살펴볼까요?</p></header>
    ${repGridMarkup('home')}
    <div class="quiz-entry"><button class="quiz-entry-btn" id="quizEntryBtn">감정 퀴즈 해보기!</button></div>
  </section>`;
  app.querySelectorAll('[data-rep]').forEach(btn=>btn.addEventListener('click',()=>openRep(btn.dataset.rep)));
  bindRepPager('home',renderHome);
  app.querySelector('#quizEntryBtn').addEventListener('click',()=>{state.quizRepPage=0;renderQuizSelect()});
  document.title='감정 확대경';
}
function openRep(id){
  const rep=representativeEmotionMap.representatives.find(r=>r.id===id);if(!rep)return;
  state.mode='EXPLORE_DETAIL';state.currentRepresentative=id;state.setIndex=0;state.selectedWord=null;renderDetail();
}
function renderDetail(){
  const rep=currentRep(); if(!rep){renderHome();return}
  const set=rep.sets[state.setIndex];
  app.innerHTML=`<section class="screen detail-screen" style="--accent:${rep.accent};--soft:${rep.soft}">
    <nav class="topbar" aria-label="감정 지도 탐색"><button class="back" id="backBtn" aria-label="대표감정 목록으로"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button><div class="top-label">${rep.representative}</div><div></div></nav>
    <header class="detail-title"><h1>${rep.representative}</h1><p>주변 감정을 눌러보세요.</p></header>
    <div class="map-wrap"><div class="map-stage" id="mapStage">
      <svg class="connectors" viewBox="0 0 360 360" preserveAspectRatio="none" aria-hidden="true">
        <line x1="180" y1="180" x2="180" y2="43"/><line x1="180" y1="180" x2="290" y2="92"/><line x1="180" y1="180" x2="310" y2="180"/><line x1="180" y1="180" x2="283" y2="268"/><line x1="180" y1="180" x2="180" y2="315"/><line x1="180" y1="180" x2="77" y2="268"/><line x1="180" y1="180" x2="50" y2="180"/><line x1="180" y1="180" x2="70" y2="92"/>
      </svg>
      <div class="center-emotion" aria-hidden="true">${rep.representative}</div>
      ${set.items.map((it,i)=>`<button class="node enter" data-word="${escapeHTML(it.word)}" data-pos="${i}" style="--node-soft:${nodePalette[(i+state.setIndex*2)%nodePalette.length]}" aria-label="${escapeHTML(it.word)} 뜻 보기">${escapeHTML(it.word)}</button>`).join('')}
    </div></div>
    <div class="set-indicator" aria-label="감정 묶음 ${state.setIndex+1} / 3">${rep.sets.map((_,i)=>`<span class="${i===state.setIndex?'on':''}"></span>`).join('')}</div>
    <section class="meaning-card meaning-placeholder" id="meaningCard" aria-live="polite"><div class="meaning-word">궁금한 감정을 눌러보세요</div></section>
    <div class="actions"><button class="btn btn-primary" id="moreBtn">${state.setIndex<2?'다른 감정 더 살펴보기':'처음 감정 다시 보기'}</button><button class="btn btn-secondary" id="homeBtn">대표감정 목록으로</button></div>
  </section>`;
  app.querySelector('#backBtn').addEventListener('click',goHome);app.querySelector('#homeBtn').addEventListener('click',goHome);
  app.querySelector('#moreBtn').addEventListener('click',()=>{const now=performance.now();if(now-lastSetChangeAt<220)return;lastSetChangeAt=now;state.setIndex=state.setIndex<2?state.setIndex+1:0;state.selectedWord=null;renderDetail()});
  app.querySelectorAll('.node').forEach(n=>n.addEventListener('click',()=>selectWord(n.dataset.word,n)));
  document.title=`${rep.representative} · 감정 확대경`;
}
function selectWord(word,node){const e=emotionByWord.get(word);if(!e)return;state.selectedWord=word;app.querySelectorAll('.node').forEach(n=>n.classList.toggle('selected',n.dataset.word===word));const card=app.querySelector('#meaningCard');card.classList.remove('meaning-placeholder');card.innerHTML=`<div class="meaning-word">${escapeHTML(e.word)}</div><div class="meaning-text">${escapeHTML(e.easyMeaning)}</div>`}
function goHome(){state.mode='HOME';renderHome()}

function renderQuizSelect(){
  state.mode='QUIZ_SELECT';state.quiz={representative:null,questions:[],index:0,score:0,answers:[],completed:false,answered:false,selected:null};
  app.innerHTML=`<section class="screen quiz-mode quiz-select-screen"><nav class="topbar" aria-label="퀴즈 모드 탐색"><button class="back" id="quizSelectBack" aria-label="감정 확대경 홈으로"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button><div></div><div></div></nav>
    <header class="quiz-select-head"><div class="quiz-mode-badge">QUIZ</div><h1>어떤 감정에 도전할까요?</h1></header>
    ${repGridMarkup('quiz')}
  </section>`;
  app.querySelector('#quizSelectBack').addEventListener('click',goHome);app.querySelectorAll('[data-quiz-rep]').forEach(b=>b.addEventListener('click',()=>openQuizIntro(b.dataset.quizRep)));bindRepPager('quiz',renderQuizSelect);document.title='감정 퀴즈 · 감정 확대경';
}
function openQuizIntro(repId){state.quiz.representative=repId;state.mode='QUIZ_INTRO';renderQuizIntro()}
function renderQuizIntro(){
  const rep=quizRep();if(!rep){renderQuizSelect();return}state.mode='QUIZ_INTRO';
  app.innerHTML=`<section class="screen quiz-mode quiz-intro-screen" style="--accent:${rep.accent};--soft:${rep.soft}"><nav class="topbar" aria-label="퀴즈 탐색"><button class="back" id="quizIntroBack" aria-label="퀴즈 감정 선택으로"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button><div class="top-label">QUIZ</div><button class="nav-home" id="quizIntroHome" aria-label="감정 확대경 홈으로">${homeIconSVG}</button></nav><div class="quiz-intro-main"><h1>${rep.representative} 감정 퀴즈</h1><div class="quiz-intro-stats" aria-label="10문제, 100점 만점"><div class="quiz-stat"><strong>10</strong><span>문제</span></div><div class="quiz-stat-rule" aria-hidden="true"></div><div class="quiz-stat"><strong>100</strong><span>점</span></div></div><div class="quiz-intro-copy">뜻을 보고 가장 가까운 감정을 골라요.</div><button class="quiz-start-btn" id="quizStartBtn">시작하기!</button></div></section>`;
  app.querySelector('#quizIntroBack').addEventListener('click',renderQuizSelect);app.querySelector('#quizIntroHome').addEventListener('click',goHome);app.querySelector('#quizStartBtn').addEventListener('click',startQuiz);document.title=`${rep.representative} 감정 퀴즈`;
}
function pickByDifficulty(bank,difficulty,count,recent){const pool=bank.filter(q=>q.difficulty===difficulty);const fresh=shuffle(pool.filter(q=>!recent.includes(q.id)));const old=shuffle(pool.filter(q=>recent.includes(q.id)));return [...fresh,...old].slice(0,count)}
function buildQuizQuestions(repId){
  const bank=quizByRep.get(repId)||[];const recent=safeRecent(repId);let picked=[...pickByDifficulty(bank,1,4,recent),...pickByDifficulty(bank,2,4,recent),...pickByDifficulty(bank,3,2,recent)];
  if(picked.length<10){const ids=new Set(picked.map(q=>q.id));picked.push(...shuffle(bank.filter(q=>!ids.has(q.id))).slice(0,10-picked.length))}
  picked=shuffle(picked).slice(0,10).map(q=>({...q,choices:shuffle(q.choices)}));saveRecent(repId,picked.map(q=>q.id));return picked;
}
function startQuiz(){
  const repId=state.quiz.representative;if(!repId)return;state.quiz.questions=buildQuizQuestions(repId);state.quiz.index=0;state.quiz.score=0;state.quiz.answers=[];state.mode='QUIZ_PLAY';quizTapLockUntil=-Infinity;renderQuizPlay();
}
function renderQuizPlay(){
  const rep=quizRep(),q=state.quiz.questions[state.quiz.index];if(!rep||!q){renderQuizSelect();return}state.mode='QUIZ_PLAY';const n=state.quiz.index+1;const answerRecord=state.quiz.answers[state.quiz.index];const answered=!!answerRecord;
  app.innerHTML=`<section class="screen quiz-mode quiz-play-screen" style="--accent:${rep.accent};--soft:${rep.soft}"><nav class="topbar" aria-label="퀴즈 탐색"><button class="back" id="quizPlayBack" aria-label="퀴즈 나가기"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button><div class="quiz-top-title">${rep.representative} 감정 퀴즈</div><button class="nav-home" id="quizPlayHome" aria-label="감정 확대경 홈으로">${homeIconSVG}</button></nav><div class="quiz-progress-head"><span class="quiz-progress-pill">${n} / 10</span></div><div class="quiz-progress-track" aria-label="퀴즈 진행 ${n} / 10"><div class="quiz-progress-fill" style="width:${n*10}%"></div></div>
    <section class="quiz-prompt-card"><p class="quiz-prompt">${escapeHTML(q.prompt)}</p></section><div class="quiz-question-label">가장 가까운 감정은?</div><div class="quiz-choice-grid">${q.choices.map(c=>{let cl='quiz-choice';if(answered){if(c===answerRecord.selected)cl+=' selected';if(c===q.answer)cl+=' correct';if(c===answerRecord.selected&&!answerRecord.correct)cl+=' wrong'}return `<button class="${cl}" data-choice="${escapeHTML(c)}" ${answered?'disabled':''}>${escapeHTML(c)}</button>`}).join('')}</div>
    ${answered?renderFeedbackHTML(q,answerRecord):''}<div class="quiz-spacer"></div></section>`;
  app.querySelector('#quizPlayBack').addEventListener('click',()=>showQuizExitConfirm('select'));app.querySelector('#quizPlayHome').addEventListener('click',()=>showQuizExitConfirm('home'));if(!answered)app.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>answerQuiz(b.dataset.choice)));else app.querySelector('#quizNextBtn').addEventListener('click',nextQuizQuestion);document.title=`${rep.representative} 감정 퀴즈 ${n}/10`;
}
function answerQuiz(choice){
  const now=performance.now();if(now<quizTapLockUntil)return;quizTapLockUntil=now+180;if(state.quiz.answers[state.quiz.index])return;const q=state.quiz.questions[state.quiz.index];const correct=choice===q.answer;if(correct)state.quiz.score+=10;state.quiz.answers[state.quiz.index]={questionId:q.id,selected:choice,answer:q.answer,correct};renderQuizPlay();
}
function renderFeedbackHTML(q,a){
  const contrast=a.correct?(Object.values(q.contrast)[0]||''):(q.contrast[a.selected]||'');
  return `<section class="quiz-feedback" aria-live="polite"><div class="quiz-feedback-title">${a.correct?'맞았어요!':'조금 달라요!'} <strong>${escapeHTML(q.answer)}</strong></div><p class="quiz-feedback-answer">${escapeHTML(q.keyPoint)}</p>${contrast?`<p class="quiz-feedback-contrast">${escapeHTML(contrast)}</p>`:''}</section><button class="quiz-next" id="quizNextBtn">${state.quiz.index===9?'결과 보기':'다음 문제'}</button>`;
}
function nextQuizQuestion(){if(!state.quiz.answers[state.quiz.index])return;if(state.quiz.index>=9){state.mode='QUIZ_RESULT';renderQuizResult()}else{state.quiz.index++;quizTapLockUntil=-Infinity;renderQuizPlay()}}
function showQuizExitConfirm(destination='select'){
  if(document.querySelector('.quiz-exit-overlay'))return;const toHome=destination==='home';const el=document.createElement('div');el.className='quiz-exit-overlay';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-labelledby','quizExitTitle');el.innerHTML=`<div class="quiz-exit-box"><h2 id="quizExitTitle">${toHome?'홈으로 갈까요?':'퀴즈를 나갈까요?'}</h2><p>${toHome?'지금 퀴즈는 끝나요.':'지금까지의 점수는 저장되지 않아요.'}</p><div class="quiz-exit-actions"><button class="quiz-exit-stay" id="stayQuiz">계속하기</button><button class="quiz-exit-leave" id="leaveQuiz">${toHome?'홈으로':'퀴즈 나가기'}</button></div></div>`;document.body.appendChild(el);el.querySelector('#stayQuiz').addEventListener('click',()=>el.remove());el.querySelector('#leaveQuiz').addEventListener('click',()=>{el.remove();toHome?goHome():renderQuizSelect()});el.addEventListener('click',e=>{if(e.target===el)el.remove()});el.querySelector('#stayQuiz').focus();
}
function renderQuizResult(){
  const rep=quizRep();if(!rep){renderQuizSelect();return}state.mode='QUIZ_RESULT';const correct=state.quiz.answers.filter(a=>a.correct).length;const wrong=state.quiz.answers.filter(a=>!a.correct);const seen=new Set();const pairs=[];for(const a of wrong){const label=`${a.selected} ↔ ${a.answer}`;if(!seen.has(label)){seen.add(label);pairs.push(label)}if(pairs.length===3)break}
  app.innerHTML=`<section class="screen quiz-mode quiz-result-screen" style="--accent:${rep.accent};--soft:${rep.soft}"><nav class="topbar" aria-label="퀴즈 결과 탐색"><button class="back" id="resultBack" aria-label="다른 감정 퀴즈 선택"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button><div class="top-label">${rep.representative} 감정 퀴즈</div><button class="nav-home" id="resultHome" aria-label="감정 확대경 홈으로">${homeIconSVG}</button></nav><div class="quiz-result-main"><div class="quiz-score">${state.quiz.score}<small>점</small></div><div class="quiz-count">${correct} / 10</div><div class="quiz-result-note">감정어 퀴즈 점수예요. 감정 능력을 평가하는 점수는 아니에요.</div>
    <section class="review-card">${wrong.length?`<h2>다시 보면 좋은 감정</h2><div class="review-pairs">${pairs.map(p=>`<span class="review-chip">${escapeHTML(p)}</span>`).join('')}</div>`:`<p class="perfect-copy">10개의 감정어 차이를 모두 찾아냈어요.</p>`}</section></div>
    <div class="result-actions"><button class="btn btn-primary" id="retryQuiz">다시 해보기</button><button class="btn btn-secondary" id="otherQuiz">다른 감정</button></div></section>`;
  app.querySelector('#resultBack').addEventListener('click',renderQuizSelect);app.querySelector('#resultHome').addEventListener('click',goHome);app.querySelector('#retryQuiz').addEventListener('click',()=>{startQuiz()});app.querySelector('#otherQuiz').addEventListener('click',renderQuizSelect);document.title=`${rep.representative} 감정 퀴즈 결과`;
}

function validateExploreData(){
  const errors=[];const words=new Set(emotionData.map(e=>e.word));const ids=new Set(emotionData.map(e=>e.id));const reps=representativeEmotionMap.representatives;const repIds=new Set();const repWords=new Set();
  if(emotionData.length!==120)errors.push(`CORE ${emotionData.length}`);if(words.size!==emotionData.length)errors.push(`unique words ${words.size}`);if(ids.size!==emotionData.length)errors.push(`unique ids ${ids.size}`);if(reps.length!==representativeEmotionMap.meta.representativeCount)errors.push(`release representatives ${reps.length}`);
  let connections=0;reps.forEach(r=>{if(repIds.has(r.id))errors.push(`duplicate rep id ${r.id}`);repIds.add(r.id);if(repWords.has(r.representative))errors.push(`duplicate rep word ${r.representative}`);repWords.add(r.representative);if(!words.has(r.representative))errors.push(`rep not in CORE ${r.representative}`);if(r.sets.length!==3)errors.push(`${r.representative}: sets ${r.sets.length}`);const seen=new Set();r.sets.forEach(set=>{if(set.items.length!==8)errors.push(`${set.id}: items ${set.items.length}`);connections+=set.items.length;const local=new Set();set.items.forEach(it=>{if(local.has(it.word))errors.push(`${set.id}: duplicate ${it.word}`);local.add(it.word);if(seen.has(it.word))errors.push(`${r.representative}: duplicate across sets ${it.word}`);seen.add(it.word);if(it.word===r.representative)errors.push(`${r.representative}: self reference`);const byWord=emotionByWord.get(it.word),byId=emotionById.get(it.emotionId);if(!byWord)errors.push(`${set.id}: unknown word ${it.word}`);if(!byId)errors.push(`${set.id}: unknown id ${it.emotionId}`);if(byWord&&byWord.id!==it.emotionId)errors.push(`${set.id}: id mismatch ${it.word}`);if(!byWord||!byWord.easyMeaning)errors.push(`${it.word}: missing easyMeaning`);if(byWord&&it.easyMeaning!==byWord.easyMeaning)errors.push(`${it.word}: easyMeaning mismatch`)})});if(seen.size!==r.sets.length*8)errors.push(`${r.representative}: unique ${seen.size}`)});
  const expectedConnections=reps.reduce((sum,r)=>sum+r.sets.reduce((n,s)=>n+s.items.length,0),0);if(connections!==expectedConnections)errors.push(`connections ${connections}/${expectedConnections}`);
  return {pass:!errors.length,errors,core:emotionData.length,reps:reps.length,sets:reps.reduce((n,r)=>n+r.sets.length,0),connections,expectedConnections,pageSize:REPRESENTATIVE_PAGE_SIZE,pages:representativePages().length};
}
function validateQuizData(){
  const errors=[];const core=new Set(emotionData.map(e=>e.word));const ids=new Set();const counts={};for(const q of quizData){counts[q.representative]=(counts[q.representative]||0)+1;if(ids.has(q.id))errors.push(`duplicate id ${q.id}`);ids.add(q.id);if(!core.has(q.answer))errors.push(`unknown answer ${q.id}`);if(q.choices.length!==4)errors.push(`choices ${q.id}`);if(new Set(q.choices).size!==4)errors.push(`choice duplicate ${q.id}`);if(q.choices.filter(x=>x===q.answer).length!==1)errors.push(`answer count ${q.id}`);q.choices.forEach(c=>{if(!core.has(c))errors.push(`unknown choice ${q.id}:${c}`)});if(!q.prompt)errors.push(`prompt blank ${q.id}`);if(!q.keyPoint)errors.push(`keyPoint blank ${q.id}`);if(q.prompt.includes(q.answer))errors.push(`answer leak ${q.id}`)}for(const r of representativeEmotionMap.representatives){if((counts[r.id]||0)<15)errors.push(`${r.id} bank ${counts[r.id]||0}`)}return {pass:!errors.length,errors,total:quizData.length,counts};
}
window.__EMOTION_LENS_DEV__={validate:validateExploreData,validateQuiz:validateQuizData,buildQuizQuestions,state,emotionData,representativeEmotionMap,quizData};
render();
</script>
