<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>감정 확대경 · Mood Meter</title>
<meta name="description" content="감정의 네 영역에서 다양한 감정어와 쉬운 뜻을 탐색하는 감정 확대경">
<style>
:root{
 --ink:#101b35;--muted:#667085;--page:#fbfcfe;--card:#fff;--line:#e4e8ef;
 --red:#F24B4B;--red-soft:#FCC4C3;--red-selected:#F78686;--red-ink:#8F1519;
 --yellow:#F7B718;--yellow-soft:#FCE8B0;--yellow-selected:#FACF6B;--yellow-ink:#5A3A00;
 --blue:#3485EE;--blue-soft:#B8D4FA;--blue-selected:#78AEF4;--blue-ink:#0F478A;
 --green:#43B449;--green-soft:#B8E3BB;--green-selected:#7DCB82;--green-ink:#0F4D18;
 --purple:#6B5CF6;--purple-dark:#5644e9;--purple-soft:#F0ECFF;
 --card-shadow:0 10px 24px rgba(24,39,75,.10),0 2px 5px rgba(24,39,75,.08);
 --button-shadow:0 6px 0 rgba(59,45,173,.18),0 12px 22px rgba(85,69,218,.18);
 --radius-card:24px;--radius-control:18px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f2f5f8;color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;word-break:keep-all;overflow-wrap:normal}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #111827;outline-offset:3px}
#app{min-height:100vh}
.screen{--area:var(--purple);--area-soft:var(--purple-soft);width:min(100%,430px);min-height:100vh;margin:0 auto;background:#fff;padding:max(18px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));position:relative}
.screen.quiz-mode{background:linear-gradient(180deg,#fff 0%,#fbf9ff 42%,#f7f4ff 100%)}
.topbar{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;min-height:48px;margin-bottom:8px}
.icon-btn{width:44px;height:44px;border:0;background:transparent;border-radius:14px;display:grid;place-items:center;cursor:pointer;font-size:27px;font-weight:900;line-height:1}
.icon-btn:active{background:#f2f4f7;transform:translateY(1px)}
.icon-svg{width:25px;height:25px;display:block;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.top-title{text-align:center;font-weight:850;font-size:15px;letter-spacing:-.3px}
.hero{padding:26px 5px 22px;text-align:left}
.hero-logo{display:flex;align-items:center;gap:10px}
.hero h1{margin:0;font-size:40px;line-height:1.02;font-weight:950;letter-spacing:-2.2px}
.hero-lens{width:33px;height:33px;border:5px solid #15966a;border-radius:50%;position:relative;flex:0 0 auto}
.hero-lens::after{content:"";position:absolute;width:15px;height:5px;background:#15966a;border-radius:4px;right:-12px;bottom:-7px;transform:rotate(45deg)}
.hero p{margin:13px 0 0;color:#555f6f;font-size:17px;line-height:1.4;letter-spacing:-.3px}
.area-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.area-card{min-height:174px;border:0;border-radius:var(--radius-card);padding:16px 12px 14px;color:#fff;cursor:pointer;box-shadow:var(--card-shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;transition:transform .18s ease,box-shadow .18s ease}
.area-card:active{transform:translateY(3px) scale(.992);box-shadow:0 5px 13px rgba(24,39,75,.10)}
.area-card[data-area="highUncomfortable"]{background:linear-gradient(145deg,#EF4148,#F6544E)}
.area-card[data-area="highComfortable"]{background:linear-gradient(145deg,#F4AC0A,#FFC620)}
.area-card[data-area="lowUncomfortable"]{background:linear-gradient(145deg,#2B78E8,#3F8FED)}
.area-card[data-area="lowComfortable"]{background:linear-gradient(145deg,#38A83E,#56C94E)}
.face-wrap{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.72);display:grid;place-items:center;margin-bottom:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.72)}
.face-svg{width:44px;height:44px}
.area-card strong{display:block;white-space:pre-line;font-size:20px;line-height:1.36;font-weight:900;letter-spacing:-.75px;text-shadow:0 1px 2px rgba(0,0,0,.12)}
.area-preview{margin-top:11px;background:#fff;border-radius:11px;padding:7px 9px;font-size:12.5px;font-weight:850;line-height:1.25;white-space:nowrap;text-shadow:none}
:is(.area-card,.quiz-area-card)[data-area="highUncomfortable"] .area-preview{color:var(--red-ink)}
:is(.area-card,.quiz-area-card)[data-area="highComfortable"] .area-preview{color:var(--yellow-ink)}
:is(.area-card,.quiz-area-card)[data-area="lowUncomfortable"] .area-preview{color:var(--blue-ink)}
:is(.area-card,.quiz-area-card)[data-area="lowComfortable"] .area-preview{color:var(--green-ink)}
:is(.area-card,.quiz-area-card)[data-area="highComfortable"] strong{color:var(--yellow-ink);text-shadow:none}
:is(.area-card,.quiz-area-card)[data-area="lowComfortable"] strong{color:var(--green-ink);text-shadow:none}
.quiz-entry,.quiz-start,.next-btn{width:100%;min-height:62px;border:0;border-radius:22px;background:linear-gradient(135deg,var(--purple),#7a56eb);color:#fff;font-size:19px;font-weight:900;letter-spacing:-.5px;cursor:pointer;box-shadow:var(--button-shadow);transition:transform .16s ease,box-shadow .16s ease}
.quiz-entry{margin-top:20px;display:flex;align-items:center;justify-content:center;gap:11px}
.quiz-entry:active,.quiz-start:active,.next-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(59,45,173,.15),0 5px 10px rgba(85,69,218,.14)}
.cta-lens{width:27px;height:27px;border:3px solid currentColor;border-radius:50%;position:relative;display:inline-block}.cta-lens::after{content:"";position:absolute;width:10px;height:3px;background:currentColor;right:-7px;bottom:-4px;border-radius:4px;transform:rotate(45deg)}
.area-heading{margin:8px 0 18px;text-align:center}
.area-heading h1{font-size:24px;line-height:1.25;margin:0;font-weight:950;letter-spacing:-1px}
.area-heading p{margin:8px 0 0;color:#697386;font-size:14px;line-height:1.45}
.emotion-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.emotion-card{min-height:84px;border:1.5px solid color-mix(in srgb,var(--area) 42%,#fff);background:color-mix(in srgb,var(--area) 34%,#fff);border-radius:17px;font-weight:850;font-size:17px;letter-spacing:-.5px;color:var(--ink);cursor:pointer;padding:9px 5px;box-shadow:0 3px 9px rgba(24,39,75,.07);transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease,background .15s ease}
.emotion-card:active{transform:translateY(2px)}
.emotion-card.selected{border:3px solid var(--area);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--area),0 8px 17px rgba(24,39,75,.12);background:color-mix(in srgb,var(--area) 67%,#fff)}
.meaning-card{margin-top:16px;min-height:108px;border:1.5px solid color-mix(in srgb,var(--area) 26%,#e8eaee);border-radius:20px;background:color-mix(in srgb,var(--area) 9%,#fff);padding:16px 17px;display:flex;flex-direction:column;justify-content:center}
.meaning-card h2{margin:0 0 7px;font-size:23px;font-weight:950;letter-spacing:-.8px;color:color-mix(in srgb,var(--area) 55%,var(--ink))}
.meaning-card p{margin:0;color:#303846;line-height:1.5;font-size:15px;font-weight:580}
.meaning-placeholder{color:#697386!important;font-weight:700!important;text-align:center}
.area-footer{margin-top:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.more-btn{width:100%;min-height:54px;border:1.5px solid color-mix(in srgb,var(--purple) 55%,#fff);background:#fff;border-radius:18px;font-weight:900;font-size:16px;color:#2c2758;padding:0 16px;cursor:pointer;box-shadow:0 5px 13px rgba(72,55,156,.08)}
.more-btn:active{transform:translateY(2px)}
.dots{display:flex;align-items:center;justify-content:center;gap:9px;min-height:16px}.dot{width:9px;height:9px;border-radius:50%;background:#d7d9e1}.dot.active{background:var(--area);transform:scale(1.15)}
.quiz-badge{width:max-content;margin:4px auto 15px;background:var(--purple-soft);color:var(--purple-dark);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:950;letter-spacing:.3px}
.quiz-select-heading{text-align:center;margin:8px 0 20px}.quiz-select-heading h1{margin:0;font-size:32px;line-height:1.13;font-weight:950;letter-spacing:-1.4px}.quiz-select-heading p{margin:10px 0 0;color:#707787;font-size:15px}
.quiz-area-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quiz-area-card{min-height:154px;border:0;border-radius:22px;padding:13px 10px;color:#fff;cursor:pointer;box-shadow:var(--card-shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;transition:transform .16s ease,box-shadow .16s ease}
.quiz-area-card:active{transform:translateY(2px)}
.quiz-area-card[data-area="highUncomfortable"]{background:linear-gradient(145deg,#EF4148,#F6544E)}.quiz-area-card[data-area="highComfortable"]{background:linear-gradient(145deg,#F4AC0A,#FFC620)}.quiz-area-card[data-area="lowUncomfortable"]{background:linear-gradient(145deg,#2B78E8,#3F8FED)}.quiz-area-card[data-area="lowComfortable"]{background:linear-gradient(145deg,#38A83E,#56C94E)}
.quiz-area-card.selected{transform:translateY(-1px);filter:saturate(1.05) brightness(.92)}
.quiz-area-card[data-area="highUncomfortable"].selected{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--red),0 13px 26px rgba(74,54,171,.14)}
.quiz-area-card[data-area="highComfortable"].selected{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--yellow),0 13px 26px rgba(74,54,171,.14)}
.quiz-area-card[data-area="lowUncomfortable"].selected{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--blue),0 13px 26px rgba(74,54,171,.14)}
.quiz-area-card[data-area="lowComfortable"].selected{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--green),0 13px 26px rgba(74,54,171,.14)}
.quiz-area-card strong{white-space:pre-line;font-size:18px;line-height:1.35;font-weight:900;letter-spacing:-.6px;text-shadow:0 1px 2px rgba(0,0,0,.12)}
.quiz-area-card .area-preview{font-size:11.5px}
.quiz-start{margin-top:19px}.quiz-start:disabled{background:#ddd9ee;color:#9892ae;box-shadow:none;cursor:not-allowed}
.quiz-top{margin:2px 0 16px}.quiz-meta{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:15px}.progress{height:9px;background:#ece9f8;border-radius:999px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:linear-gradient(90deg,#7a5cf6,#b060e8);border-radius:inherit;transition:width .2s ease}
.prompt-card{min-height:126px;border:1px solid #eee9f7;border-radius:24px;background:#fff;box-shadow:var(--card-shadow);padding:23px 18px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;line-height:1.55;font-weight:850;letter-spacing:-.55px}
.quiz-question{margin:18px 0 13px;text-align:center;font-size:16px;font-weight:900}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.choice{min-height:64px;border:1.5px solid #e3dfec;background:#fff;border-radius:17px;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 4px 10px rgba(30,37,65,.06)}.choice:active:not(:disabled){transform:translateY(2px)}.choice.correct{background:#dff4dc;border-color:#65bd61;color:#1e6a28}.choice.wrong{background:#ffe0dc;border-color:#ee7568;color:#9d2b20}.choice:disabled{opacity:1}
.feedback{margin-top:15px;padding:16px 17px;border-radius:19px;background:#fff;border:1.5px solid #eadff7;box-shadow:0 4px 12px rgba(66,45,128,.06)}.feedback strong{display:block;color:var(--purple-dark);font-size:21px;font-weight:950;margin-bottom:5px}.feedback p{margin:0;font-size:14px;line-height:1.5;color:#424959}.next-btn{margin-top:13px;min-height:56px;font-size:17px}
.result-wrap{text-align:center;padding:18px 4px 4px}.result-label{font-size:15px;font-weight:900;color:var(--purple-dark)}.score{font-size:88px;line-height:1;font-weight:950;letter-spacing:-5px;color:var(--purple);margin:19px 0 4px;text-shadow:0 7px 20px rgba(94,75,219,.16)}.score small{font-size:32px;letter-spacing:-1px;margin-left:2px}.result-sub{font-size:15px;color:#677085;font-weight:750;margin-bottom:26px}.result-actions{display:grid;gap:10px}.secondary-btn{min-height:54px;border:1.5px solid #cfc8fa;background:#fff;border-radius:18px;color:#3e347a;font-weight:900;font-size:16px;cursor:pointer}.secondary-btn:active{transform:translateY(2px)}
@media(max-width:379px){.screen{padding-left:14px;padding-right:14px}.hero{padding-top:20px}.hero h1{font-size:35px}.hero p{font-size:15px}.area-grid,.quiz-area-grid{gap:9px}.area-card{min-height:157px;padding:13px 8px}.area-card strong{font-size:18px}.face-wrap{width:50px;height:50px}.face-svg{width:38px;height:38px}.area-preview{font-size:11.5px;padding:6px 7px}.quiz-entry{margin-top:15px;min-height:57px}.area-heading{margin-bottom:14px}.area-heading h1{font-size:22px}.emotion-grid{gap:8px}.emotion-card{min-height:76px;font-size:15.5px}.meaning-card{min-height:100px;margin-top:13px;padding:13px 14px}.quiz-select-heading h1{font-size:28px}.quiz-area-card{min-height:141px}.prompt-card{font-size:18px;min-height:116px;padding:19px 14px}.choice{min-height:59px;font-size:16px}.score{font-size:78px}}
@media(min-width:431px){body{padding:20px 0}.screen{min-height:calc(100vh - 40px);border-radius:32px;box-shadow:0 22px 60px rgba(26,38,62,.13);overflow:hidden}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

function homeIcon(){return `<svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3l8.5 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-6h5v6"/></svg>`}
function faceIcon(type){
 const angry=type==='angry',sad=type==='sad',calm=type==='calm';
 const eyes=angry?`<path d="M11 18l5 2M29 20l5-2"/><circle cx="15" cy="22" r="2.1"/><circle cx="31" cy="22" r="2.1"/>`:calm?`<path d="M12 21c2.2 2 4.5 2 6.5 0M27.5 21c2.2 2 4.5 2 6.5 0"/>`:`<circle cx="15" cy="20" r="2.2"/><circle cx="31" cy="20" r="2.2"/>`;
 const mouth=sad||angry?`<path d="M14 34c4-5 14-5 18 0"/>`:`<path d="M14 30c4 6 14 6 18 0"/>`;
 return `<svg class="face-svg" viewBox="0 0 46 46" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">${eyes}${mouth}</g></svg>`;
}
function areaStyle(area){return `--area:${area.color};--area-soft:${area.soft}`}
function areaItems(areaId){const area=areaById.get(areaId);if(!area)return[];return area.displayOrder.map(id=>{const m=mappingById.get(id);return {...m,emotion:emotionById.get(id)}})}
function pagesForArea(areaId){const arr=areaItems(areaId),pages=[];for(let i=0;i<arr.length;i+=PAGE_SIZE)pages.push(arr.slice(i,i+PAGE_SIZE));return pages}
function resetAreaState(){state.currentArea=null;state.pageIndex=0;state.selectedEmotionId=null}
function resetQuiz(){state.quiz={area:null,questions:[],index:0,score:0,answers:[]}}
function render(){({HOME:renderHome,AREA_EXPLORE:renderArea,QUIZ_SELECT:renderQuizSelect,QUIZ_PLAY:renderQuizPlay,QUIZ_RESULT:renderQuizResult}[state.mode]||renderHome)()}

function areaCardMarkup(a,cls='area-card',selected=false){return `<button class="${cls}${selected?' selected':''}" data-area="${a.id}" aria-label="${escapeHTML(a.displayLabel)}"><span class="face-wrap" style="color:${a.ink}">${faceIcon(a.face)}</span><strong>${escapeHTML(a.label)}</strong><span class="area-preview">예: ${a.preview.map(escapeHTML).join(', ')}</span></button>`}
function renderHome(){
 state.mode='HOME';resetAreaState();resetQuiz();
 app.innerHTML=`<main class="screen"><header class="hero"><div class="hero-logo"><h1>감정 확대경</h1><span class="hero-lens" aria-hidden="true"></span></div><p>다양한 감정의 세계를 탐색해 보세요</p></header><div class="area-grid">${emotionAreaMap.areas.map(a=>areaCardMarkup(a)).join('')}</div><button class="quiz-entry" id="quizEntry"><span class="cta-lens" aria-hidden="true"></span>감정 퀴즈 해보기</button></main>`;
 app.querySelectorAll('.area-card').forEach(b=>b.addEventListener('click',()=>openArea(b.dataset.area)));app.querySelector('#quizEntry').addEventListener('click',renderQuizSelect);document.title='감정 확대경';
}
function openArea(areaId){if(!areaById.has(areaId))return;state.mode='AREA_EXPLORE';state.currentArea=areaId;state.pageIndex=0;state.selectedEmotionId=null;renderArea()}
function renderArea(){
 const area=areaById.get(state.currentArea);if(!area)return renderHome();const pages=pagesForArea(area.id);state.pageIndex=Math.max(0,Math.min(state.pageIndex,pages.length-1));const items=pages[state.pageIndex]||[];const selected=state.selectedEmotionId?emotionById.get(state.selectedEmotionId):null;
 app.innerHTML=`<main class="screen" style="${areaStyle(area)}"><nav class="topbar"><button class="icon-btn" id="areaBack" aria-label="뒤로">${backIcon()}</button><div></div><button class="icon-btn" id="areaHome" aria-label="홈으로">${homeIcon()}</button></nav><header class="area-heading"><h1>${escapeHTML(area.displayLabel)}</h1><p>해당 영역의 감정들을 살펴보세요.</p></header><div class="emotion-grid" role="list">${items.map(x=>`<button class="emotion-card ${x.emotionId===state.selectedEmotionId?'selected':''}" role="listitem" data-emotion="${x.emotionId}" aria-pressed="${x.emotionId===state.selectedEmotionId?'true':'false'}">${escapeHTML(x.word)}</button>`).join('')}</div><section class="meaning-card" aria-live="polite">${selected?`<h2>${escapeHTML(selected.word)}</h2><p>${escapeHTML(selected.easyMeaning)}</p>`:`<p class="meaning-placeholder">감정을 눌러 쉬운 뜻을 확인해 보세요.</p>`}</section><div class="area-footer"><button class="more-btn" id="areaNext">다른 감정 더 살펴보기&nbsp;&nbsp;›</button><div class="dots" aria-label="${pages.length}페이지 중 ${state.pageIndex+1}페이지">${pages.map((_,i)=>`<span class="dot ${i===state.pageIndex?'active':''}"></span>`).join('')}</div></div></main>`;
 app.querySelector('#areaBack').addEventListener('click',renderHome);app.querySelector('#areaHome').addEventListener('click',renderHome);app.querySelectorAll('[data-emotion]').forEach(b=>b.addEventListener('click',()=>{state.selectedEmotionId=b.dataset.emotion;renderArea()}));app.querySelector('#areaNext').addEventListener('click',()=>{state.pageIndex=(state.pageIndex+1)%pages.length;state.selectedEmotionId=null;renderArea()});document.title=`${area.displayLabel} · 감정 확대경`;
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function safeRecent(areaId){try{return JSON.parse(sessionStorage.getItem('emotionLensAreaQuizRecent:'+areaId)||'[]')}catch(_e){return[]}}
function saveRecent(areaId,ids){try{sessionStorage.setItem('emotionLensAreaQuizRecent:'+areaId,JSON.stringify(ids.slice(0,14)))}catch(_e){}}
function pickByDifficulty(bank,difficulty,count,recent){const pool=bank.filter(q=>q.difficulty===difficulty),fresh=shuffle(pool.filter(q=>!recent.includes(q.id))),old=shuffle(pool.filter(q=>recent.includes(q.id)));return [...fresh,...old].slice(0,count)}
function buildQuizQuestions(areaId){const bank=quizAreaBanks.get(areaId)||[],recent=safeRecent(areaId);let picked=[...pickByDifficulty(bank,1,4,recent),...pickByDifficulty(bank,2,4,recent),...pickByDifficulty(bank,3,2,recent)];if(picked.length<10){const ids=new Set(picked.map(q=>q.id));picked.push(...shuffle(bank.filter(q=>!ids.has(q.id))).slice(0,10-picked.length))}picked=shuffle(picked).slice(0,10).map(q=>({...q,choices:shuffle(q.choices)}));saveRecent(areaId,picked.map(q=>q.id));return picked}
function renderQuizSelect(){
 state.mode='QUIZ_SELECT';resetQuiz();
 app.innerHTML=`<main class="screen quiz-mode"><nav class="topbar"><button class="icon-btn" id="quizBack" aria-label="뒤로">${backIcon()}</button><div></div><button class="icon-btn" id="quizHome" aria-label="홈으로">${homeIcon()}</button></nav><div class="quiz-badge">QUIZ</div><header class="quiz-select-heading"><h1>어떤 영역으로<br>도전할까요?</h1><p>영역을 고르면 10문제가 시작돼요.</p></header><div class="quiz-area-grid">${emotionAreaMap.areas.map(a=>areaCardMarkup(a,'quiz-area-card',false)).join('')}</div><button class="quiz-start" id="quizStart" disabled>감정 퀴즈 시작하기</button></main>`;
 const start=app.querySelector('#quizStart');app.querySelector('#quizBack').addEventListener('click',renderHome);app.querySelector('#quizHome').addEventListener('click',renderHome);app.querySelectorAll('.quiz-area-card').forEach(b=>b.addEventListener('click',()=>{state.quiz.area=b.dataset.area;app.querySelectorAll('.quiz-area-card').forEach(x=>x.classList.toggle('selected',x===b));start.disabled=false}));start.addEventListener('click',()=>{if(!state.quiz.area)return;state.quiz.questions=buildQuizQuestions(state.quiz.area);state.quiz.index=0;state.quiz.score=0;state.quiz.answers=[];state.mode='QUIZ_PLAY';renderQuizPlay()});document.title='감정 퀴즈 · 영역 선택';
}
function renderQuizPlay(){
 const area=areaById.get(state.quiz.area),q=state.quiz.questions[state.quiz.index];if(!area||!q)return renderQuizSelect();const rec=state.quiz.answers[state.quiz.index],answered=!!rec,n=state.quiz.index+1;
 app.innerHTML=`<main class="screen quiz-mode"><nav class="topbar"><button class="icon-btn" id="qpBack" aria-label="퀴즈 선택으로">${backIcon()}</button><div class="top-title">${escapeHTML(area.short)} 퀴즈</div><button class="icon-btn" id="qpHome" aria-label="홈으로">${homeIcon()}</button></nav><section class="quiz-top"><div class="quiz-meta"><span>${n} / 10</span><span>${escapeHTML(area.short)}</span></div><div class="progress"><div style="width:${n*10}%"></div></div></section><div class="prompt-card">${escapeHTML(q.prompt)}</div><p class="quiz-question">가장 가까운 감정은?</p><div class="choice-grid">${q.choices.map(c=>`<button class="choice ${answered&&c===q.answer?'correct':''} ${answered&&c===rec?.selected&&!rec?.correct?'wrong':''}" data-choice="${escapeHTML(c)}" ${answered?'disabled':''}>${escapeHTML(c)}</button>`).join('')}</div>${answered?`<div class="feedback"><strong>${rec.correct?'맞았어요!':'조금 달라요!'}</strong><p><b>${escapeHTML(q.answer)}</b> · ${escapeHTML(q.keyPoint)}</p></div><button class="next-btn" id="quizNext">${n===10?'결과 보기':'다음 문제'}</button>`:''}</main>`;
 app.querySelector('#qpBack').addEventListener('click',renderQuizSelect);app.querySelector('#qpHome').addEventListener('click',renderHome);if(!answered)app.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>answerQuiz(b.dataset.choice)));else app.querySelector('#quizNext').addEventListener('click',nextQuiz);document.title=`${area.short} 퀴즈 · ${n}/10`;
}
function answerQuiz(choice){if(state.quiz.answers[state.quiz.index])return;const q=state.quiz.questions[state.quiz.index],correct=choice===q.answer;state.quiz.answers[state.quiz.index]={selected:choice,correct};if(correct)state.quiz.score+=10;renderQuizPlay()}
function nextQuiz(){if(state.quiz.index>=9){state.mode='QUIZ_RESULT';renderQuizResult()}else{state.quiz.index++;renderQuizPlay()}}
function renderQuizResult(){
 const area=areaById.get(state.quiz.area);if(!area)return renderQuizSelect();const correct=state.quiz.answers.filter(x=>x?.correct).length;
 app.innerHTML=`<main class="screen quiz-mode"><nav class="topbar"><button class="icon-btn" id="qrBack" aria-label="다른 영역 퀴즈">${backIcon()}</button><div class="top-title">${escapeHTML(area.short)} 퀴즈</div><button class="icon-btn" id="qrHome" aria-label="홈으로">${homeIcon()}</button></nav><section class="result-wrap"><div class="result-label">감정어 뜻 QUIZ</div><div class="score">${state.quiz.score}<small>점</small></div><div class="result-sub">10문제 중 ${correct}개 맞았어요.</div><div class="result-actions"><button class="quiz-start" id="quizRetry">다시 풀기</button><button class="secondary-btn" id="quizOther">다른 영역 퀴즈</button></div></section></main>`;
 app.querySelector('#qrBack').addEventListener('click',renderQuizSelect);app.querySelector('#qrHome').addEventListener('click',renderHome);app.querySelector('#quizOther').addEventListener('click',renderQuizSelect);app.querySelector('#quizRetry').addEventListener('click',()=>{state.quiz.questions=buildQuizQuestions(state.quiz.area);state.quiz.index=0;state.quiz.score=0;state.quiz.answers=[];state.mode='QUIZ_PLAY';renderQuizPlay()});document.title=`${state.quiz.score}점 · 감정 퀴즈`;
}

function validateAreaData(){
 const errors=[],coreIds=new Set(emotionData.map(e=>e.id));if(emotionData.length!==120)errors.push(`CORE ${emotionData.length}`);if(emotionAreaMap.areas.length!==4)errors.push(`area count ${emotionAreaMap.areas.length}`);if(new Set(emotionAreaMap.areas.map(a=>a.id)).size!==4)errors.push('area id duplicate');if(emotionAreaMap.meta.pageSize!==PAGE_SIZE)errors.push(`page size ${emotionAreaMap.meta.pageSize}`);
 const primarySeen=new Set(),orderSeen=new Set(),counts={},boundary=emotionAreaMap.mappings.filter(m=>m.boundary).length;for(const a of emotionAreaMap.areas){counts[a.id]=a.displayOrder.length;const prim=emotionAreaMap.mappings.filter(m=>m.primaryArea===a.id).map(m=>m.emotionId),ps=new Set(prim);if(a.displayOrder.length!==ps.size)errors.push(`displayOrder count ${a.id}`);for(const id of a.displayOrder){if(!coreIds.has(id))errors.push(`display unknown ${a.id}:${id}`);if(!ps.has(id))errors.push(`display nonprimary ${a.id}:${id}`);if(orderSeen.has(id))errors.push(`display duplicate ${id}`);orderSeen.add(id)}}
 for(const m of emotionAreaMap.mappings){if(!coreIds.has(m.emotionId))errors.push(`unknown emotionId ${m.emotionId}`);if(primarySeen.has(m.emotionId))errors.push(`duplicate primary ${m.emotionId}`);primarySeen.add(m.emotionId);if(!areaById.has(m.primaryArea))errors.push(`unknown primary area ${m.word}`);for(const a of m.alternateAreas)if(!areaById.has(a))errors.push(`unknown alternate area ${m.word}`);if((m.sourceActivation==='중간'||m.sourceDirection==='맥락의존')&&!m.mappingReason)errors.push(`semantic reason missing ${m.word}`)}
 const unplaced=[...coreIds].filter(id=>!primarySeen.has(id)),orderMissing=[...coreIds].filter(id=>!orderSeen.has(id));if(unplaced.length)errors.push(`unplaced ${unplaced.length}`);if(orderMissing.length)errors.push(`display missing ${orderMissing.length}`);return{pass:!errors.length,errors,core:emotionData.length,areas:emotionAreaMap.areas.length,uniquePrimary:primarySeen.size,unmapped:unplaced.length,displayOrderUnique:orderSeen.size,displayOrderMissing:orderMissing.length,boundaryEmotions:boundary,counts,pageSize:PAGE_SIZE}
}
function validateQuizData(){
 const errors=[],core=new Set(emotionData.map(e=>e.word)),ids=new Set(),bankCounts={};for(const a of emotionAreaMap.areas)bankCounts[a.id]=0;for(const q of quizData){if(ids.has(q.id))errors.push(`duplicate id ${q.id}`);ids.add(q.id);if(!core.has(q.answer))errors.push(`unknown answer ${q.id}`);if(q.choices.length!==4)errors.push(`choices ${q.id}`);if(new Set(q.choices).size!==4)errors.push(`choice duplicate ${q.id}`);if(q.choices.filter(x=>x===q.answer).length!==1)errors.push(`answer count ${q.id}`);for(const c of q.choices)if(!core.has(c))errors.push(`unknown choice ${q.id}:${c}`);const area=primaryAreaByWord.get(q.answer);if(!area)errors.push(`quiz no area ${q.id}`);else bankCounts[area]++;if(!q.prompt)errors.push(`prompt blank ${q.id}`);if(!q.keyPoint)errors.push(`keyPoint blank ${q.id}`);if(q.prompt.includes(q.answer))errors.push(`answer leak ${q.id}`)}for(const [a,n] of Object.entries(bankCounts))if(n<10)errors.push(`${a} bank ${n}`);return{pass:!errors.length,errors,total:quizData.length,uniqueIds:ids.size,bankCounts}
}
window.__EMOTION_LENS_DEV__={validateAreaData,validateQuizData,emotionData,emotionAreaMap,representativeEmotionMap,quizData,state,pagesForArea,buildQuizQuestions,quizAreaBanks,primaryAreaByWord};
render();
</script>
</body>
