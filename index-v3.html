(function(){
 const moodWords={
  highUncomfortable:[['긴장','불안','걱정'],['짜증','화남','분노'],['두려움','답답함','겁남']],
  highComfortable:[['설렘','기대감','신남'],['즐거움','기쁨','유쾌함'],['감격','뿌듯함','행복감']],
  lowUncomfortable:[['서운함','실망','낙담'],['외로움','슬픔','쓸쓸함'],['허전함','허탈함','공허함']],
  lowComfortable:[['안심','안도감','홀가분함'],['편안함','평온함','만족감'],['친근함','감사함','사랑']]
 };
 function face(kind){const c=kind==='red'?'#a64a43':kind==='yellow'?'#9a7410':kind==='blue'?'#426aa7':'#478354';const mouth=(kind==='red'||kind==='blue')?'<path d="M13 31c4-5 14-5 18 0"/>':'<path d="M13 28c4 6 14 6 18 0"/>';const brows=kind==='red'?'<path d="M10 17l6 3M34 17l-6 3"/>':'';const eyes=kind==='green'?'<path d="M11 20c2.5 2 5 2 7 0M28 20c2.5 2 5 2 7 0"/>':'<circle cx="15" cy="20" r="2"/><circle cx="31" cy="20" r="2"/>';return '<svg viewBox="0 0 46 46" aria-hidden="true"><g fill="none" stroke="'+c+'" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">'+brows+eyes+mouth+'</g></svg>'}
 function areaTitle(id){return({highUncomfortable:'빨강 영역',highComfortable:'노랑 영역',lowUncomfortable:'파랑 영역',lowComfortable:'초록 영역'})[id]||''}
 function areaFromPoint(x,y){if(y<.5&&x<.5)return'highUncomfortable';if(y<.5&&x>=.5)return'highComfortable';if(y>=.5&&x<.5)return'lowUncomfortable';return'lowComfortable'}
 function wordFromPoint(area,x,y){const lx=(x<.5?x/.5:(x-.5)/.5),ly=(y<.5?y/.5:(y-.5)/.5),col=Math.min(2,Math.floor(lx*3)),row=Math.min(2,Math.floor(ly*3));return moodWords[area][row][col]}
 const mood={x:null,y:null,area:null,word:null};
 const originalRenderHome=renderHome;
 renderHome=function(){
  state.mode='HOME';resetAreaState();resetQuiz();
  app.innerHTML='<main class="screen"><header class="hero"><div class="hero-logo"><h1>감정 확대경</h1><span class="hero-lens" aria-hidden="true"></span></div><p>감정의 이름을 찾고, 뜻을 살펴보며<br>내 마음을 조금 더 자세히 들여다보세요.</p></header><div class="area-grid">'+emotionAreaMap.areas.map(a=>areaCardMarkup(a)).join('')+'</div><button class="quiz-entry" id="quizEntry"><span class="cta-lens" aria-hidden="true"></span>감정 퀴즈 해보기</button><button class="mood-entry" id="moodEntry"><span class="mood-entry-mark" aria-hidden="true"><i class="dot d1"></i><i class="dot d2"></i><i class="dot d3"></i><i class="dot d4"></i></span><span class="mood-entry-copy"><strong>감정 지도 살펴보기</strong><small>감정의 위치를 살펴보고, 지금 내 마음도 직접 찾아봅니다.</small></span><span class="mood-entry-arrow" aria-hidden="true">›</span></button></main>';
  app.querySelectorAll('.area-card').forEach(b=>b.addEventListener('click',()=>openArea(b.dataset.area)));
  app.querySelector('#quizEntry').addEventListener('click',renderQuizSelect);
  app.querySelector('#moodEntry').addEventListener('click',renderMoodIntro);
  document.title='감정 확대경';
 };
 renderMoodIntro=function(){
  state.mode='MOOD_INTRO';
  app.innerHTML='<main class="screen quiz-mode"><nav class="topbar"><button class="icon-btn" id="miBack" aria-label="뒤로">'+backIcon()+'</button><div class="top-title">감정 확대경</div><button class="icon-btn" id="miHome" aria-label="홈으로">'+homeIcon()+'</button></nav><div class="mood-kicker">감정을 보는 또 하나의 방법</div><header class="mood-heading"><h1>감정 지도 살펴보기</h1><p>감정은 <b>편안한지 불편한지</b>, 그리고 <b>에너지가 높은지 낮은지</b>를 함께 보면 조금 더 자세히 살펴볼 수 있어요.</p></header><section class="mood-map-card"><span class="axis-tag axis-top">에너지 높음 ↑</span><span class="axis-tag axis-bottom">↓ 에너지 낮음</span><span class="axis-tag axis-left">불편함</span><span class="axis-tag axis-right">편안함</span><i class="axis-cross-v"></i><i class="axis-cross-h"></i><div class="mood-quads"><div class="mood-quad mq-red"><div class="mood-quad-face">'+face('red')+'</div><strong>빨강 영역</strong><small>불편함 · 에너지 높음</small><div class="mood-chip-row"><span class="mood-mini-chip">긴장</span><span class="mood-mini-chip">화남</span><span class="mood-mini-chip">불안</span></div></div><div class="mood-quad mq-yellow"><div class="mood-quad-face">'+face('yellow')+'</div><strong>노랑 영역</strong><small>편안함 · 에너지 높음</small><div class="mood-chip-row"><span class="mood-mini-chip">신남</span><span class="mood-mini-chip">기쁨</span><span class="mood-mini-chip">설렘</span></div></div><div class="mood-quad mq-blue"><div class="mood-quad-face">'+face('blue')+'</div><strong>파랑 영역</strong><small>불편함 · 에너지 낮음</small><div class="mood-chip-row"><span class="mood-mini-chip">서운함</span><span class="mood-mini-chip">슬픔</span><span class="mood-mini-chip">외로움</span></div></div><div class="mood-quad mq-green"><div class="mood-quad-face">'+face('green')+'</div><strong>초록 영역</strong><small>편안함 · 에너지 낮음</small><div class="mood-chip-row"><span class="mood-mini-chip">편안함</span><span class="mood-mini-chip">안도감</span><span class="mood-mini-chip">만족감</span></div></div></div></section><p class="mood-note">감정을 <b>좋은 감정 / 나쁜 감정</b>으로 나누는 지도가 아니에요. 지금 내 마음의 <b>느낌과 에너지</b>가 어디쯤인지 찾아보기 위한 지도예요.</p><button class="mood-next-btn" id="moodPickGo">내 마음도 찾아보기&nbsp;&nbsp;→</button></main>';
  app.querySelector('#miBack').addEventListener('click',renderHome);app.querySelector('#miHome').addEventListener('click',renderHome);app.querySelector('#moodPickGo').addEventListener('click',()=>{mood.x=mood.y=mood.area=mood.word=null;renderMoodPick()});document.title='감정 지도 살펴보기 · 감정 확대경';
 };
