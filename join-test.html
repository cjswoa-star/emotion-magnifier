<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>감정확대경 · 함께 참여 [시험용]</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#23304a;background:#f3f3fa}
body.joined{height:100dvh;overflow:hidden}button,input{font:inherit}.landing{display:flex;min-height:100dvh;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 10% 0%,#dfdcff,transparent 36%),#f4f6fc}
.card{width:min(100%,430px);border-radius:29px;background:#fff;padding:32px 29px;box-shadow:0 17px 55px #33335b17;border:1px solid #e8e8f4}.symbol{display:grid;place-items:center;color:white;background:linear-gradient(130deg,#8271f9,#5e51cc);border-radius:20px;font-size:29px;height:62px;width:62px;margin-bottom:20px}
h1{font-size:27px;letter-spacing:-1px;margin:0 0 10px}.desc{font-size:14px;color:#707a93;line-height:1.7;margin:0 0 24px}.field{display:block;font-size:13px;font-weight:800;margin:15px 0 8px}.input{height:56px;width:100%;border:1.5px solid #dfe1ee;border-radius:15px;font-size:19px;padding:0 15px;outline-color:#7763eb}.primary{height:57px;width:100%;border:none;border-radius:15px;background:#6e5ae4;color:#fff;font-size:16px;font-weight:800;margin-top:23px;cursor:pointer;box-shadow:0 6px 0 #5748bd20}.primary:disabled{opacity:.5}.msg{font-size:13px;line-height:1.6;margin:15px 0 0;color:#795a9c}.hint{font-size:12px;color:#8891a1;margin:8px 0 0}.top{height:55px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;background:#ffffff;box-shadow:0 3px 12px #30334c12;gap:7px}.top strong{font-size:14px}.top span{font-size:12px;color:#68728c}.top button{border:1px solid #ddddee;background:#f8f7ff;padding:7px 10px;border-radius:9px;color:#6858c9}.appwrap{height:calc(100dvh - 55px)}iframe{width:100%;height:100%;border:0;background:#fff}.hidden{display:none!important}
</style></head><body>
<div class="landing" id="landing"><div class="card"><div class="symbol">◌</div><h1>감정 확대경</h1><p class="desc">내 마음도 찾아보고, 감정 퀴즈에도 도전해 보세요.<br>워크숍 참여용 시범 화면입니다.</p>
<label class="field" for="code">참여코드</label><input class="input" id="code" placeholder="6자리 코드" maxlength="6" inputmode="numeric" autocomplete="off">
<label class="field" for="nick">닉네임</label><input class="input" id="nick" maxlength="12" placeholder="예: 마음탐험가" autocomplete="off"><p class="hint">실제 이름 대신 별명을 입력해 주세요.</p>
<button class="primary" id="join">참여하기</button><p class="msg" id="msg"></p></div></div>
<div class="hidden" id="studentView"><div class="top"><strong>감정확대경</strong><span id="who">활동 중</span><button id="leave">나가기</button></div><div class="appwrap"><iframe id="v3" title="감정확대경 V3" src="about:blank"></iframe></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getDatabase,ref,get,set,update} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
const config={apiKey:"AIzaSyB6mWBT6IYc9BkGBPvPhIb0HBDA0Vj3Bxo",authDomain:"emotion-share-test.firebaseapp.com",databaseURL:"https://emotion-share-test-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"emotion-share-test",storageBucket:"emotion-share-test.firebasestorage.app",messagingSenderId:"9314731156",appId:"1:9314731156:web:528c2ff5274f3c4cbee081"};
const $=x=>document.getElementById(x),root="emotionMagnifierTest/sessions/";let db,code="",pid="",moodid="",lastQuiz="",lastMood="",completedMoodSignature="",observer=null,frameAttached=false;
try{db=getDatabase(initializeApp(config));}catch(e){$("msg").textContent="접속 설정 오류: "+e.message;}
const qs=new URLSearchParams(location.search);$("code").value=qs.get("code")||"";
$("join").addEventListener("click",async()=>{code=$("code").value.trim();const nickname=$("nick").value.trim().slice(0,12);if(!/^\d{6}$/.test(code)){return $("msg").textContent="참여코드 6자리를 입력해 주세요."}if(!nickname)return $("msg").textContent="닉네임을 입력해 주세요.";if(!db)return $("msg").textContent="Firebase 연결에 실패했습니다.";
$("join").disabled=true;$("msg").textContent="참여방 확인 중…";
try{const snap=await get(ref(db,root+code+"/meta"));if(!snap.exists()||snap.val().status!=="open")throw Error("참여할 수 있는 방이 아닙니다.");const key="EMOTION_MAGNIFIER_TEST_PID_"+code;pid=localStorage.getItem(key)||("p"+crypto.randomUUID().replace(/-/g,"").slice(0,18));localStorage.setItem(key,pid);const mk="EMOTION_MAGNIFIER_TEST_ANONMOOD_"+code;moodid=localStorage.getItem(mk)||("m"+crypto.randomUUID().replace(/-/g,"").slice(0,18));localStorage.setItem(mk,moodid);const existing=await get(ref(db,root+code+"/participants/"+pid));await update(ref(db,root+code+"/participants/"+pid),{nickname,joinedAt:existing.exists()?existing.val().joinedAt||Date.now():Date.now(),updatedAt:Date.now()});
$("landing").classList.add("hidden");$("studentView").classList.remove("hidden");document.body.classList.add("joined");$("who").textContent=nickname+" · "+code;$("v3").src="index-v3.html";$("v3").addEventListener("load",startInspect,{once:true});}
catch(e){$("msg").textContent="참여 실패: "+e.message;}finally{$("join").disabled=false}});
$("leave").addEventListener("click",()=>{location.reload()});
function startInspect(){let tries=0;const timer=setInterval(()=>{tries++;try{const outer=$("v3").contentDocument,inner=outer?.getElementById("appFrame")?.contentWindow,doc=inner?.document,dev=inner?.__EMOTION_LENS_DEV__;if(doc&&dev&&doc.getElementById("app")){clearInterval(timer);attach(doc,dev);return}}catch(e){console.warn("iframe 검사 중",e)}if(tries>100){clearInterval(timer);console.warn("감정확대경 연결 시간을 초과했습니다.")}},250)}
function attach(doc,dev){if(frameAttached)return;frameAttached=true;const app=doc.getElementById("app");let scheduled=false;const inspect=()=>{scheduled=false;saveQuiz(dev);saveMood(doc)};
observer=new MutationObserver(()=>{if(!scheduled){scheduled=true;setTimeout(inspect,130)}});observer.observe(app,{childList:true,subtree:true,attributes:true,attributeFilter:["class","style"]});
doc.addEventListener("click",e=>{if(e.target.closest("#moodFinish")){captureMood(doc,true)}setTimeout(inspect,140)},true);inspect();}
async function write(path,value){try{await set(ref(db,root+code+"/participants/"+pid+"/"+path),value)}catch(e){console.warn("결과 저장 실패",path,e);$("who").textContent="저장 오류 · 다시 확인"}}
function saveQuiz(dev){const state=dev.state;if(!state||!state.quiz||!state.quiz.area||!state.quiz.questions?.length)return;
const q=state.quiz;const answers={};q.questions.forEach((item,i)=>{const a=q.answers[i];if(a)answers[item.id]={questionId:item.id,prompt:item.prompt,selected:a.selected,correct:!!a.correct,answer:item.answer,choices:item.choices}});
const data={score:q.score||0,answeredCount:Object.keys(answers).length,completedAt:state.mode==="QUIZ_RESULT"?Date.now():null,updatedAt:Date.now(),answers};
const hash=JSON.stringify([q.area,q.questions.map(x=>x.id),data.score,data.answeredCount,!!data.completedAt]);if(hash===lastQuiz)return;lastQuiz=hash;write("quizAreas/"+q.area,data);}
function readMood(doc,finished){const marker=doc.querySelector("#meterMarker"),title=doc.querySelector(".meter-result h2");if(!marker||!title||marker.style.display==="none")return null;const x=parseFloat(marker.style.left)/100,y=parseFloat(marker.style.top)/100;if(!Number.isFinite(x)||!Number.isFinite(y))return null;const area=(y<.5?"high":"low")+(x<.5?"Uncomfortable":"Comfortable");return{area,x,y,word:title.textContent.trim(),completedAt:finished?Date.now():null,updatedAt:Date.now()}}
function captureMood(doc,finished){const data=readMood(doc,finished);if(!data)return;const hash=JSON.stringify([data.area,data.x,data.y,data.word,!!data.completedAt]);const selection=JSON.stringify([data.area,data.x,data.y,data.word]);if(!finished&&selection===completedMoodSignature)return;if(finished)completedMoodSignature=selection;if(hash===lastMood)return;lastMood=hash;set(ref(db,root+code+"/moods/"+moodid),data).catch(e=>console.warn("익명 감정 저장 실패",e))}
function saveMood(doc){captureMood(doc,false)}
</script></body></html>
